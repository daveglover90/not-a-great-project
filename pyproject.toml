[project]
name = "snyk-ai-demo"
version = "0.1.0"
description = "Demo app with AI models, MCP clients/servers and agent skills, built to show Snyk AI-BOM and Snyk Agent Scan"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.2",
    "mcp[cli]>=1.9",
    "transformers>=4.44",
    "datasets>=2.20",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.24",
]
